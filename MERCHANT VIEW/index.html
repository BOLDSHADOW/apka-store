<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#1651a3">
    <title>Merchant Dashboard | Apka Store</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="merchant-app">
        <header class="merchant-header">
            <div>
                <p class="eyebrow">APKA STORE</p>
                <h1>Merchant Dashboard</h1>
                <p class="merchant-name" id="merchantName">Loading your account…</p>
            </div>
            <button class="sign-out-button" id="signOutButton" type="button">Sign out</button>
        </header>

        <section class="merchant-actions" aria-label="Merchant tools">
            <button class="merchant-action" type="button" data-action="Orders">
                <span class="action-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M5 4h14v16H5zM8 8h8M8 12h8M8 16h5"/></svg></span>
                <span>Orders</span>
            </button>
            <button class="merchant-action" type="button" data-action="Chats">
                <span class="action-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M20 15a3 3 0 0 1-3 3H9l-5 3V7a3 3 0 0 1 3-3h10a3 3 0 0 1 3 3zM8 10h8M8 14h5"/></svg></span>
                <span>Chats</span>
            </button>
            <button class="merchant-action" type="button" data-action="Inventory">
                <span class="action-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="m4 7 8-4 8 4-8 4-8-4Zm0 5 8 4 8-4M4 17l8 4 8-4"/></svg></span>
                <span>Inventory</span>
            </button>
            <button class="merchant-action" type="button" data-action="Settings">
                <span class="action-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.88l.06.06-2.1 2.1-.06-.06a1.7 1.7 0 0 0-1.88-.34 1.7 1.7 0 0 0-1.03 1.56v.1h-3v-.1a1.7 1.7 0 0 0-1.03-1.56 1.7 1.7 0 0 0-1.88.34l-.06.06-2.1-2.1.06-.06A1.7 1.7 0 0 0 7.06 15 1.7 1.7 0 0 0 5.5 14H5.4v-3h.1a1.7 1.7 0 0 0 1.56-1.03 1.7 1.7 0 0 0-.34-1.88l-.06-.06 2.1-2.1.06.06a1.7 1.7 0 0 0 1.88.34 1.7 1.7 0 0 0 1.03-1.56v-.1h3v.1a1.7 1.7 0 0 0 1.03 1.56 1.7 1.7 0 0 0 1.88-.34l.06-.06 2.1 2.1-.06.06a1.7 1.7 0 0 0-.34 1.88A1.7 1.7 0 0 0 20.5 11h.1v3h-.1A1.7 1.7 0 0 0 19.4 15Z"/></svg></span>
                <span>Settings</span>
            </button>
        </section>

        <section class="dashboard-card">
            <h2 id="dashboardTitle">Welcome</h2>
            <p id="dashboardMessage">Choose an option above to manage your store.</p>
        </section>
    </main>
    <script type="module" src="script.js"></script>
</body>
</html>
